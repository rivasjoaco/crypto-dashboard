<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Crypto Control</title>

  <!-- ESTA LINEA CARGA EL CSS -->
  <link rel="stylesheet" href="css/styles.css">

</head>


<body>

  <main>

    <header>

      <div>

        <p class="eyebrow">
          FIWIND · CARTERA PERSONAL
        </p>

        <h1>
          Crypto Control
        </h1>

        <p class="muted">
          Precio actual → compras históricas → promedio → recuperación
        </p>

      </div>

    </header>


    <section
      id="kpis"
      class="kpis">
    </section>


    <section class="toolbar">

      <div>

        <b>
          Precios actuales
        </b>

        <span class="muted">
          Por ahora manuales. Quedan guardados en este dispositivo.
        </span>

      </div>


      <button id="clear">
        Limpiar precios
      </button>

    </section>


    <section
      id="cards"
      class="cards">
    </section>

  </main>


  <!-- ESTA LINEA CARGA EL JAVASCRIPT -->
  <script src="js/app.js"></script>

</body>

</html>
