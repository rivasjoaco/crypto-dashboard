<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Control - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <header>
            <div>
                <p class="eyebrow">FIWIND · CARTERA PERSONAL</p>
                <h1>Crypto Control</h1>
                <p class="muted">Precio actual → compras históricas → promedio → recuperación</p>
            </div>
        </header>

        <!-- KPI GENERALES -->
        <section id="kpis" class="kpis"></section>

        <!-- BARRA DE HERRAMIENTAS -->
        <section class="toolbar">
            <div>
                <b>Precios en vivo (API Binance)</b>
                <span class="muted" style="display: block; margin-top: 4px; font-size: 13px;">
                    Se actualizan automáticamente cada 30 segundos.
                </span>
            </div>
            <button id="refresh" type="button">Actualizar Ahora</button>
        </section>

        <!-- TARJETAS DE MONEDAS -->
        <section id="cards" class="cards"></section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
