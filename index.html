<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Control | Fiwind</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Librería para el Gráfico de Torta -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <main>
        <header class="app-header">
            <div class="header-titles">
                <span class="badge">ACTUALIZACIÓN AUTOMÁTICA EN VIVO</span>
                <h1>Mi Billetera</h1>
            </div>
            <button id="refresh" class="btn-refresh">↻ Sincronizar</button>
        </header>

        <!-- KPI GENERALES -->
        <section id="kpis" class="dashboard-hero"></section>

        <!-- NUEVOS MÓDULOS: GRÁFICO Y SIMULADOR -->
        <div class="modules-grid">
            <!-- Módulo 3: Composición de Cartera -->
            <section class="module-card">
                <h3>Composición de Riesgo</h3>
                <div class="chart-container">
                    <canvas id="portfolioChart"></canvas>
                </div>
            </section>

            <!-- Módulo 2: Simulador What-If -->
            <section class="module-card simulator-card">
                <h3>Simulador de Escenarios</h3>
                <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 10px;">
                    Deslizá para ver qué pasaría con tu plata si el precio de Bitcoin cambia (tus otras monedas seguirán la tendencia).
                </p>
                <div class="simulator-display" id="sim-price-display">Cargando...</div>
                <input type="range" id="btc-slider" min="20000" max="250000" step="1000" value="80000">
                <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                    <span style="font-size: 12px; color: var(--text-secondary);">BTC $20k</span>
                    <button id="reset-sim" class="btn-outline">Volver a precio real</button>
                    <span style="font-size: 12px; color: var(--text-secondary);">BTC $250k</span>
                </div>
            </section>
        </div>

        <h2 class="section-title">Análisis por Activo</h2>
        <section id="cards" class="crypto-grid"></section>
    </main>

    <script src="app.js"></script>
</body>
</html>
