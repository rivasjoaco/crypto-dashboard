<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crypto Control</title>

    <link rel="stylesheet" href="css/styles.css">
</head>


<body>

    <main>

        <header>

            <div>

                <p class="eyebrow">
                    FIWIND · CARTERA PERSONAL
                </p>

                <h1>
                    Crypto Control
                </h1>

                <p class="muted">
                    Precio actual → compras históricas → promedio → recuperación
                </p>

            </div>

        </header>


        <!-- ============================= -->
        <!-- RESUMEN GENERAL DE CARTERA -->
        <!-- ============================= -->

        <section
            id="kpis"
            class="kpis">
        </section>


        <!-- ============================= -->
        <!-- PRECIOS -->
        <!-- ============================= -->

        <section class="toolbar">

            <div>

                <b>
                    Precios actuales
                </b>

                <span class="muted">
                    Por ahora manuales. Quedan guardados en este dispositivo.
                </span>

            </div>


            <button
                id="clear"
                type="button">

                Limpiar precios

            </button>

        </section>


        <!-- ============================= -->
        <!-- BTC / ETH / SOL / ADA / BNB -->
        <!-- ============================= -->

        <section
            id="cards"
            class="cards">
        </section>

    </main>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="js/app.js"></script>

</body>

</html>
